name: Arduino check
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: test
        run: |
          # Проверяем существование конфиг-файла
          ls
          if [ ! -f arduino/Bike/config.h ]; then
            echo "ERROR: config file not found!"
            exit 1
          fi  
          echo "Config file exist"
          g++ arduino/Bike/tests/testBTSerial.cpp ../BTSerial.cpp ../Parameters.cpp ../mystring.cpp ../config.cpp -isystem include include/Arduino.cpp include/SoftwareSerial.cpp  -o testBTSerial
          ./testBTSerial
          rm testBTSerial